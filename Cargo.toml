[package]
name = "impulse"
version = "0.1.0"
edition = "2024"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3


[dependencies]
astrora_core = { git = "https://github.com/JoeHowarth/astrora.git", branch = "main", features = ["serde"] }
# bevy = { git = "https://github.com/JoeHowarth/bevy.git", branch = "main", features = ["dynamic_linking"] }
bevy = { git = "https://github.com/JoeHowarth/bevy.git", branch = "main", features = [] }
avian3d = { version = "0.4", default-features = false, features = [
    "3d",
    "f64",
    "parry-f64",
] }
bevy_pancam = "0.19.0"
bevy_vector_shapes = "0.11.0"
big_space = { version = "0.11.0", features = ["bevy_camera"] }
serde = "1.0.228"
serde_json = "1.0.145"
rand = "0.8.5"
bincode = "1.3"
rayon = "1.10"
log = { version = "*", features = [
    "max_level_debug",
    "release_max_level_warn",
] }

