[package]
name = "impulse"
version = "0.1.0"
edition = "2024"

[dependencies]
astrora_core = { path = "astrora", features = ["serde"] }
bevy = { path = "bevy" }
bevy_pancam = "0.19.0"
# use git branch wb/updatebevy0.17
# from https://github.com/ForesightMiningSoftwareCorporation/bevy_polyline
bevy_polyline = { git = "https://github.com/ForesightMiningSoftwareCorporation/bevy_polyline", branch = "wb/updatebevy0.17" }
bevy_vector_shapes = "0.11.0"
big_space = "0.11.0"
serde = "1.0.228"
serde_json = "1.0.145"
rand = "0.8.5"
bincode = "1.3"
rayon = "1.10"

[patch.crates-io]
astrora_core = { path = "astrora" }
bevy = { path = "bevy" }
bevy_a11y = { path = "bevy/crates/bevy_a11y" }
bevy_animation = { path = "bevy/crates/bevy_animation" }
